services:
  postgres:
    image: postgres:16-alpine
    container_name: hrt_postgres
    restart: no
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hrt-network

  redis:
    image: redis:alpine
    container_name: hrt_redis
    restart: no
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - hrt-network

  neo4j:
    image: neo4j:5.19
    container_name: hrt_neo4j
    restart: no
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    ports:
      - "${NEO4J_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - hrt-network

  ai_service:
    build: 
      context: ./BE/ai-service
      dockerfile: Dockerfile
    container_name: hrt_ai_service
    restart: no
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - hrt-network

  ollama:
    image: ollama/ollama:latest
    container_name: hrt_ollama
    restart: no
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - hrt-network

  ollama-init:
    image: ollama/ollama:latest
    container_name: hrt_ollama_init
    depends_on:
      - ollama
    networks:
      - hrt-network
    entrypoint: ["sh", "-c", "sleep 10 && OLLAMA_HOST=ollama:11434 ollama pull qwen3-embedding:0.6b"]

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  ollama_data:

networks:
  hrt-network:
