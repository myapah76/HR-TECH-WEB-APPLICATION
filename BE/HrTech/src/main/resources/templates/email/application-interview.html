<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Verdana, sans-serif; background-color: #f8f1e7; padding: 40px;">

<div style="max-width: 520px; margin: auto; background: #fff;
            border-radius: 16px; padding: 30px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);">

    <h1 style="text-align:center; color:#4b2e2a;">HR Tech</h1>

    <h2 style="color:#4b2e2a;">Interview Invitation</h2>

    <p>Xin chào <span th:text="${fullName}"></span>,</p>

    <p>
        Hồ sơ ứng tuyển của bạn cho vị trí
        <b th:text="${jobTitle}"></b>
        đã được chuyển sang vòng phỏng vấn.
    </p>

    <div style="text-align:center; margin:30px 0;">
        <span style="background:#4b2e2a; color:white; padding:12px 20px;
                     text-decoration:none; border-radius:8px; font-weight:bold;"
              th:text="${newStatus}">
            INTERVIEW
        </span>
    </div>

    <p>Bộ phận tuyển dụng sẽ liên hệ với bạn để thông báo chi tiết lịch phỏng vấn.</p>

    <div th:replace="~{email/fragments/footer :: footer}"></div>

</div>
</body>
</html>
